name: Backfill sanciones 2020+
on:
  workflow_dispatch:
    inputs:
      from_year: {description: 'Año inicial', default: '2020', required: true}
      to_year: {description: 'Año final', default: '2026', required: true}
      sources: {description: 'Fuentes', default: 'UAF,CMF,SCJ,SUSESO,SP', required: true}
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: python scripts/run_pipeline.py --from-year ${{ inputs.from_year }} --to-year ${{ inputs.to_year }} --sources "${{ inputs.sources }}"
      - run: pytest -q && python scripts/validate_publish.py
      - run: |
          git config user.name "radar-sanciones-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/data/
          git diff --cached --quiet || git commit -m "data: backfill sanciones ${{ inputs.from_year }}-${{ inputs.to_year }}"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: docs}
      - id: deployment
        uses: actions/deploy-pages@v4
